[project]
name = "payment_network"
authors = [{ name = "LedgerX", email = "hello@ledgerx.local" }]
description = "Electronic payments and a network of field agents: wallets, cash custody, commissions, settlements and accounting links"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
erpnext = ">=16.0.0-dev,<18.0.0"

[tool.pytest.ini_options]
testpaths = ["payment_network/tests"]
addopts = "--ignore=payment_network/tests/test_engine.py"
